    <rect x="133" y="500" width="8" height="10"/><rect x="163" y="500" width="8" height="10"/>
    <rect x="148" y="522" width="8" height="10"/><rect x="178" y="522" width="8" height="10"/>
    <rect x="133" y="544" width="8" height="10"/><rect x="163" y="544" width="8" height="10"/>
    <!-- bldg center-left (x=225) -->
    <rect x="233" y="440" width="8" height="10"/><rect x="248" y="440" width="8" height="10"/><rect x="263" y="440" width="8" height="10"/><rect x="278" y="440" width="8" height="10"/>
    <rect x="233" y="462" width="8" height="10"/><rect x="263" y="462" width="8" height="10"/>
    <rect x="248" y="484" width="8" height="10"/><rect x="278" y="484" width="8" height="10"/>
    <rect x="233" y="506" width="8" height="10"/><rect x="263" y="506" width="8" height="10"/>
    <!-- bldg tall center-left (x=305) -->
    <rect x="312" y="358" width="7" height="9"/><rect x="325" y="358" width="7" height="9"/><rect x="338" y="358" width="7" height="9"/>
    <rect x="312" y="380" width="7" height="9"/><rect x="338" y="380" width="7" height="9"/>
    <rect x="325" y="402" width="7" height="9"/><rect x="312" y="424" width="7" height="9"/><rect x="338" y="424" width="7" height="9"/>
    <rect x="312" y="446" width="7" height="9"/><rect x="325" y="446" width="7" height="9"/>
    <rect x="338" y="468" width="7" height="9"/><rect x="312" y="490" width="7" height="9"/>
    <!-- center cluster (x=406) -->
    <rect x="414" y="390" width="8" height="10"/><rect x="428" y="390" width="8" height="10"/><rect x="442" y="390" width="8" height="10"/><rect x="456" y="390" width="8" height="10"/>
    <rect x="414" y="412" width="8" height="10"/><rect x="442" y="412" width="8" height="10"/>
    <rect x="428" y="434" width="8" height="10"/><rect x="456" y="434" width="8" height="10"/>
    <rect x="414" y="456" width="8" height="10"/><rect x="442" y="456" width="8" height="10"/>
    <!-- tall center-right (x=479) -->
    <rect x="486" y="368" width="7" height="9"/><rect x="499" y="368" width="7" height="9"/><rect x="512" y="368" width="7" height="9"/>
    <rect x="486" y="390" width="7" height="9"/><rect x="512" y="390" width="7" height="9"/>
    <rect x="499" y="412" width="7" height="9"/><rect x="486" y="434" width="7" height="9"/><rect x="512" y="434" width="7" height="9"/>
    <rect x="486" y="456" width="7" height="9"/><rect x="499" y="456" width="7" height="9"/>
    <rect x="512" y="478" width="7" height="9"/><rect x="486" y="500" width="7" height="9"/>
    <!-- right (x=542) -->
    <rect x="550" y="458" width="8" height="10"/><rect x="565" y="458" width="8" height="10"/><rect x="580" y="458" width="8" height="10"/><rect x="595" y="458" width="8" height="10"/>
