    <rect x="565" y="502" width="8" height="10"/><rect x="595" y="502" width="8" height="10"/>
    <!-- right-tall (x=635) -->
    <rect x="643" y="412" width="7" height="9"/><rect x="656" y="412" width="7" height="9"/><rect x="669" y="412" width="7" height="9"/>
    <rect x="643" y="434" width="7" height="9"/><rect x="669" y="434" width="7" height="9"/>
    <rect x="656" y="456" width="7" height="9"/><rect x="643" y="478" width="7" height="9"/>
    <!-- far right (x=706) -->
    <rect x="714" y="498" width="7" height="9"/><rect x="727" y="498" width="7" height="9"/><rect x="740" y="498" width="7" height="9"/>
    <rect x="714" y="520" width="7" height="9"/><rect x="740" y="520" width="7" height="9"/>
    <rect x="727" y="542" width="7" height="9"/>
    <!-- far right (x=762) -->
    <rect x="768" y="478" width="6" height="8"/><rect x="780" y="478" width="6" height="8"/>
    <rect x="768" y="498" width="6" height="8"/><rect x="780" y="498" width="6" height="8"/>
  </g>

  <!-- ── xoxo text ── -->
  <text
    x="400" y="248"
    text-anchor="middle"
    font-family="'Brush Script MT','Palatino Linotype',Georgia,cursive"
    font-size="210"
    font-weight="700"
    fill="white"
    transform="rotate(-4,400,248)"
    filter="url(#xoxo-glow)">xoxo</text>

  <!-- ── GOSSIP GIRL subtitle ── -->
  <text
    x="400" y="308"
    text-anchor="middle"
    font-family="'Helvetica Neue',Arial,sans-serif"
    font-size="26"
    font-weight="300"
    letter-spacing="11"
    fill="#f6e7b9"
    opacity="0.92">G O S S I P   G I R L</text>

  <!-- ── Play button ── -->
  <circle cx="400" cy="400" r="38" fill="#000000" fill-opacity="0.38"
    stroke="white" stroke-opacity="0.55" stroke-width="2"/>
  <polygon points="394,384 394,416 422,400" fill="white" opacity="0.92"/>

  <!-- ── Vignette ── -->
  <rect width="800" height="800" fill="url(#vig)"/>
</svg>
